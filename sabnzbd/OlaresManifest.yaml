olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3
metadata:
  name: sabnzbd
  appid: sabnzbd
  title: SABnzbd
  description: Automated Usenet downloader with repair, unpacking and a web interface
  version: 0.1.1
  icon: https://raw.githubusercontent.com/sabnzbd/sabnzbd/master/icons/logo-arrow.svg
  categories:
    - Utilities_v112
    - homelab
entrances:
  - name: sabnzbd
    title: SABnzbd
    host: sabnzbd
    port: 8080
    icon: https://raw.githubusercontent.com/sabnzbd/sabnzbd/master/icons/logo-arrow.svg
    authLevel: private
    openMethod: window
workloadReplicas:
  sabnzbd: 1
permission:
  appData: true
  userData:
    - Home/Downloads/SABnzbd
spec:
  versionName: '5.1.3'
  developer: The SABnzbd Team
  submitter: donbodbod
  website: https://sabnzbd.org/
  sourceCode: https://github.com/sabnzbd/sabnzbd
  doc: https://sabnzbd.org/wiki/
  locale:
    - en-US
    - fr-FR
  supportArch:
    - amd64
    - arm64
  license:
    - text: GPL-2.0
      url: https://github.com/sabnzbd/sabnzbd/blob/master/LICENSE.txt
  fullDescription: |
    SABnzbd automates Usenet downloads through a browser. Add NZB files,
    configure your own Usenet provider, and let SABnzbd download, verify,
    repair and unpack your files.

    This Olares package uses the LinuxServer.io image. Access is protected
    by the private Olares entrance. Configuration persists in AppData;
    downloads are stored in Home/Downloads/SABnzbd on Olares.

    Incomplete and completed downloads share one volume for efficient moves.
    The initial article cache is 256 MB. Provider accounts and indexers are
    configured after installation; no credentials are bundled.
  accelerator:
    - mode: cpu
      requiredCpu: 100m
      limitedCpu: '4'
      requiredMemory: 128Mi
      limitedMemory: 2Gi
      requiredDisk: 2Gi
      limitedDisk: 100Gi
options:
  allowedOutboundPorts:
    - 119
    - 563
    - 443
  dependencies:
    - name: olares
      type: system
      version: '>=1.12.6-0'
